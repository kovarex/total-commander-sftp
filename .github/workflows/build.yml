name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake zip openssh-server wine64
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('scripts/build-deps.sh', 'scripts/mingw64.cmake') }}
      - name: Build OpenSSL and libssh2
        run: scripts/build-deps.sh
      - name: Build plugin
        run: ./build.sh
      - name: End-to-end tests under Wine
        run: sudo WINEPREFIX=$HOME/.wine-tcsftp tests/run-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tcsftp
          path: build/tcsftp.zip
