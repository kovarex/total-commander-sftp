name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 cmake zip openssh-server wine64
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('scripts/build-deps.sh', 'scripts/mingw64.cmake') }}
      - name: Build OpenSSL and libssh2
        run: scripts/build-deps.sh
      - name: Build plugin
        run: ./build.sh
      - name: End-to-end tests under Wine
        run: sudo WINEPREFIX=/tmp/wine-tcsftp tests/run-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tcsftp
          path: build/tcsftp.zip
      # Each new PLUGIN_VERSION that lands on main becomes a GitHub release with the zip attached.
      - name: Release new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*PLUGIN_VERSION L"\(.*\)".*/\1/p' src/common.h)
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            cp build/tcsftp.zip "build/tcsftp-$VERSION.zip"
            gh release create "v$VERSION" "build/tcsftp-$VERSION.zip" --title "tcsftp $VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
